name: Acquisition OS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SESSION_PEPPER: ci-only-not-a-secret-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Environment validation
        run: npm run env:check
      - name: Verify (typecheck, lint, test, build)
        run: npm run verify
      - name: Tenant Isolation Suite (mandatory)
        run: npm run test:isolation -w @acquisition-os/api
      - name: Coverage report
        run: npm run test:coverage -w @acquisition-os/api

  governance-smoke:
    name: governance-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Sprint 2 close gate still green
        run: npm run governance:close -- 2
